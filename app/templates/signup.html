{% extends "base.html" %}
{% block title %}Sign up · Silent Crisis{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Create your account</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Name <input name="name" value="{{ name }}" maxlength="80" autocomplete="name" required autofocus></label>
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="email" required></label>
    <label>Password <input type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <small>At least 8 characters.</small></label>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
