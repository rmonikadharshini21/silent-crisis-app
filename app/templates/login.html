{% extends "base.html" %}
{% block title %}Log in · Silent Crisis{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Log in</h1>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</section>
{% endblock %}
